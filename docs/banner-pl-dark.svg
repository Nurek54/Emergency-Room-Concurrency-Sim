<style>
  text { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .title { font-size: 44px; font-weight: 800; fill: #E6EDF3; letter-spacing: -0.5px; }
  .sub { font-size: 18px; fill: #9CA3AF; }
  .tag { font-size: 13px; fill: #F43F5E; font-weight: 700; letter-spacing: 0.4px; }
  .ct { font-size: 13px; font-weight: 700; }
