  .ecg { fill: none; stroke: url(#fade); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s linear infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 1400; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .chip { opacity: 0; animation: up .6s ease-out forwards; }
  .chip:nth-of-type(1) { animation-delay: .2s; } .chip:nth-of-type(2) { animation-delay: .35s; }
  .chip:nth-of-type(3) { animation-delay: .5s; } .chip:nth-of-type(4) { animation-delay: .65s; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chip { opacity: 1; } .ecg { stroke-dashoffset: 0; } .pt { display: none; } }
</style>
